<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Панель администратора</title>
</head>
<body class="container">
<header class="d-flex flex-wrap justify-content-center py-3">
    <a href="index.html"
       class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <span class="fs-4 mx-2 fw-medium">Светлые Сны</span>
    </a>

    <ul class="nav">
        <li class="nav-item"><a href="index.html" class="nav-link">На главную</a></li>
        <li class="nav-item"><a href="#" class="nav-link" id="logout-btn">Выйти</a></li>
    </ul>
</header>
<main>
    <div class="d-flex justify-content-between flex-wrap align-items-center">
        <h1>Панель администратора</h1>
    </div>
    <div id="bookings-container" class="d-flex justify-content-around flex-wrap align-items-start">
        <!-- Здесь будут динамически отображаться карточки заявок -->
    </div>
</main>

<footer class="py-2 my-2">
    <ul class="nav justify-content-between align-items-center">
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">ул. г.Москва, ул. Ивовая, 48</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">Время работы: Пн-Пт, с 8:00-17:00</a></li>
        <li class="nav-item"><a href="tel:88005553535" class="nav-link text-body-secondary">тел. 8 (800) 555 - 35 -
            35</a></li>
        <li class="nav-item"><a href="mailto:обращения@СветлыеСны.рф" class="nav-link text-body-secondary">Email: обращения@СветлыеСны.рф</a>
        </li>
    </ul>
</footer>
<script src="js/jquery-3.7.1.slim.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script>
    // Проверка авторизации (используем localStorage, чтобы не терялось при перезагрузке)
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    // --- Функции для работы с заявками (встроены прямо здесь, чтобы избежать проблем) ---

    const BOOKINGS_KEY = 'hotelBookings';

    function getBookings() {
        try {
            const data = localStorage.getItem(BOOKINGS_KEY);
            return data ? JSON.parse(data) : [];
        } catch (e) {
            console.error('Ошибка чтения заявок:', e);
            return [];
        }
    }

    function saveBookings(bookings) {
        localStorage.setItem(BOOKINGS_KEY, JSON.stringify(bookings));
    }

    function updateBookingStatus(bookingId, newStatus) {
        const bookings = getBookings();
        const booking = bookings.find(b => b.id === bookingId);
        if (booking) {
            booking.status = newStatus;
            saveBookings(bookings);
            console.log('Статус обновлён:', bookingId, newStatus);
            return true;
        }
        console.error('Заявка не найдена:', bookingId);
        return false;
    }

    function deleteBooking(bookingId) {
        let bookings = getBookings();
        bookings = bookings.filter(b => b.id !== bookingId);
        saveBookings(bookings);
    }

    // --- Отрисовка карточек ---

    function renderBookings() {
        const bookings = getBookings();
        const container = document.getElementById('bookings-container');
        container.innerHTML = '';

        if (bookings.length === 0) {
            container.innerHTML = '<div class="alert alert-info w-100 text-center">Новых заявок нет.</div>';
            return;
        }

        // Сортируем заявки: сначала новые
        bookings.sort((a, b) => (b.id > a.id ? 1 : -1));

        bookings.forEach(booking => {
            const card = document.createElement('div');
            card.className = 'card admin-card';

            const statusClass = booking.status === 'Одобрена' ? 'text-bg-success' : 'text-bg-secondary';

            card.innerHTML = `
                <div class="card-body">
                    <h5 class="card-title">Заявка от: ${booking.lastName} ${booking.firstName}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">Категория: ${booking.roomCategory}</h6>
                    <p class="card-text">
                        <strong>Телефон:</strong> ${booking.phone}<br>
                        <strong>Email:</strong> ${booking.email}<br>
                        <strong>Дата заезда:</strong> ${formatDateRu(booking.checkInDate)}<br>
                        <strong>Дата выезда:</strong> ${formatDateRu(booking.checkOutDate)}
                    </p>
                    <p class="card-text"><strong>Статус:</strong> <span class="badge ${statusClass}">${booking.status}</span></p>
                </div>
                <div class="d-grid gap-2 card-footer bg-transparent border-0 pt-0">
                    ${booking.status === 'На рассмотрении'
                        ? `<button class="btn btn-success approve-btn" data-id="${booking.id}">Одобрить</button>`
                        : ''}
                    <button class="btn btn-danger delete-btn" data-id="${booking.id}">Удалить</button>
                </div>
            `;

            container.appendChild(card);
        });

        // Привязываем обработчики к кнопкам
        document.querySelectorAll('.approve-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                if (updateBookingStatus(id, 'Одобрена')) {
                    renderBookings();
                } else {
                    alert('Не удалось обновить заявку. Попробуйте ещё раз.');
                }
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                if (confirm('Вы уверены, что хотите удалить эту заявку?')) {
                    deleteBooking(id);
                    renderBookings();
                }
            });
        });
    }

    function formatDateRu(dateStr) {
        if (!dateStr) return '-';
        const d = new Date(dateStr);
        return d.toLocaleDateString('ru-RU');
    }

    // --- Инициализация ---

    document.addEventListener('DOMContentLoaded', function () {
        renderBookings();

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'index.html';
        });
    });
</script>
</body>
</html>
