<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Панель администратора</title>
</head>
<body class="container">
<header class="d-flex flex-wrap justify-content-center py-3">
    <a href="index.html"
       class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <span class="fs-4 mx-2 fw-medium">Светлые Сны</span>
    </a>

    <ul class="nav">
        <li class="nav-item"><a href="index.html" class="nav-link">На главную</a></li>
        <li class="nav-item"><a href="#" class="nav-link" id="logout-btn">Выйти</a></li>
    </ul>
</header>
<main>
    <div class="d-flex justify-content-between flex-wrap align-items-center">
        <h1>Панель администратора</h1>
    </div>
    <div id="bookings-container" class="d-flex justify-content-around flex-wrap align-items-start">
        <!-- Здесь будут динамически отображаться карточки заявок -->
    </div>
</main>

<footer class="py-2 my-2">
    <ul class="nav justify-content-between align-items-center">
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">ул. г.Москва, ул. Ивовая, 48</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">Время работы: Пн-Пт, с 8:00-17:00</a></li>
        <li class="nav-item"><a href="tel:88005553535" class="nav-link text-body-secondary">тел. 8 (800) 555 - 35 -
            35</a></li>
        <li class="nav-item"><a href="mailto:обращения@СветлыеСны.рф" class="nav-link text-body-secondary">Email: обращения@СветлыеСны.рф</a>
        </li>
    </ul>
</footer>
<script src="js/jquery-3.7.1.slim.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/index.js"></script>
<script>
    $(document).ready(function () {
        // 1. Проверка авторизации
        if (!isAdminLoggedIn()) {
            window.location.href = 'login.html';
            return;
        }

        // 2. Функция для отрисовки карточек заявок
        function renderBookings() {
            const bookings = getBookings();
            const container = $('#bookings-container');
            container.empty();

            if (bookings.length === 0) {
                container.html('<div class="alert alert-info w-100 text-center">Новых заявок нет.</div>');
                return;
            }

            // Сортируем заявки: сначала новые
            bookings.sort((a, b) => b.id - a.id);

            bookings.forEach(booking => {
                const card = `
                    <div class="card" style="min-width: 20rem;">
                        <div class="card-body">
                            <h5 class="card-title">Заявка от: ${booking.lastName} ${booking.firstName}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">Категория: ${booking.roomCategory}</h6>
                            <p class="card-text">
                                <strong>Телефон:</strong> ${booking.phone}<br>
                                <strong>Email:</strong> ${booking.email}<br>
                                <strong>Дата заезда:</strong> ${new Date(booking.checkInDate).toLocaleDateString('ru-RU')}<br>
                                <strong>Дата выезда:</strong> ${new Date(booking.checkOutDate).toLocaleDateString('ru-RU')}
                            </p>
                             <p class="card-text"><strong>Статус:</strong> <span class="badge ${booking.status === 'Одобрена' ? 'text-bg-success' : 'text-bg-secondary'}">${booking.status}</span></p>
                        </div>
                        <div class="d-grid gap-2 card-footer bg-transparent border-0 pt-0">
                            ${booking.status === 'На рассмотрении' ? `<button class="btn btn-success approve-btn" data-id="${booking.id}">Одобрить</button>` : ''}
                            <button class="btn btn-danger delete-btn" data-id="${booking.id}">Удалить</button>
                        </div>
                    </div>
                `;
                container.append(card);
            });
        }

        // 3. Обработчики событий
        $('#logout-btn').on('click', function(e) {
            e.preventDefault();
            logoutAdmin();
        });

        // Делегирование событий для кнопок "Одобрить" и "Удалить"
        $('#bookings-container').on('click', '.approve-btn', function() {
            const bookingId = $(this).data('id');
            updateBookingStatus(bookingId, 'Одобрена');
            renderBookings(); // Перерисовываем список
        });

        $('#bookings-container').on('click', '.delete-btn', function() {
            const bookingId = $(this).data('id');
            if (confirm('Вы уверены, что хотите удалить эту заявку?')) {
                deleteBooking(bookingId);
                renderBookings(); // Перерисовываем список
            }
        });

        // 4. Первоначальная отрисовка
        renderBookings();
    });
</script>
</body>
</html>
